<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#05060f" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="matrixAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#auraGlow)" stroke-width="4" opacity="0.4" />

  <!-- Background Matrix Digital Grid Pattern -->
  <g opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,8">
    <line x1="64" y1="64" x2="64" y2="448" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="192" y1="64" x2="192" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="320" y1="64" x2="320" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
    <line x1="448" y1="64" x2="448" y2="448" />
  </g>

  <!-- Glowing Aura Core Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#auraGlow)" stroke-width="24" filter="url(#glowFilter)" stroke-linecap="round" stroke-dasharray="600 200" transform="rotate(-30 256 256)" />

  <!-- Center A Symbol Geometric Cyber Hexagon -->
  <path d="M256 120 L360 340 L310 340 L285 285 L227 285 L202 340 L152 340 Z M256 215 L237 255 L275 255 Z" fill="url(#auraGlow)" filter="url(#glowFilter)" />
  
  <!-- Sparkles & Digital Matrix Nodes -->
  <circle cx="256" cy="120" r="10" fill="#38bdf8" />
  <circle cx="360" cy="340" r="8" fill="#ec4899" />
  <circle cx="152" cy="340" r="8" fill="#6366f1" />
  <circle cx="256" cy="215" r="6" fill="#10b981" />
</svg>
